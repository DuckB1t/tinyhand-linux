[package]
name = "tinyhand-linux"
version = "1.1.0"
edition = "2021"
description = "Native Wayland/Hyprland presentation pointer and screen-drawing overlay"
license = "MIT"
repository = "https://github.com/DuckB1t/tinyhand-linux"

[lib]
name = "tinyhand_linux"
path = "src/lib.rs"

[[bin]]
name = "tinyhand"
path = "src/bin/tinyhand.rs"

[[bin]]
name = "tinyhandctl"
path = "src/bin/tinyhandctl.rs"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
evdev = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
memmap2 = "0.9"
nix = { version = "0.30", features = ["fs", "poll", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wait-timeout = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
